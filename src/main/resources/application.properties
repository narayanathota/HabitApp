spring.application.name=habit-tracker
server.port=8080

# No datasource configured on purpose - this app has no external database.
# All habit data is held in-memory (ConcurrentHashMap) for the life of the process.

spring.mvc.problemdetails.enabled=true

# Health endpoints for container / Kubernetes probes:
#   /actuator/health, /actuator/health/liveness, /actuator/health/readiness
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
